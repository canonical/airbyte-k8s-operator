name: Publish Charm

on:
  push:
    branches:
      - main

# Serialize runs per ref so the mirror can't race a concurrent publish.
concurrency:
  group: publish-charm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Push to `main` publishes latest/edge. Track branches publish their own N/edge
  # via their own copy of this file; they're left unpushed (dormant) meanwhile.
  test-and-publish-charm:
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@main
    secrets: inherit
    permissions:
      contents: write

  # Keep the current major track on the same revision as latest/edge (no rebuild).
  # Bump destination-channel to the new major (3/edge) when main moves to v3.
  mirror-to-major-track:
    if: github.ref_name == 'main'
    needs: test-and-publish-charm
    uses: canonical/operator-workflows/.github/workflows/promote_charm.yaml@main
    with:
      origin-channel: latest/edge
      destination-channel: 2/edge
      doc-automation-disabled: true
    secrets: inherit
